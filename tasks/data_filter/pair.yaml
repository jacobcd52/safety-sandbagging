rubric:
  - id: fix_blocklist_word_boundaries
    description: Blocklist matching must respect word boundaries so terms do not fire on substrings of longer words.
    grader: test
    test: test_hidden.py::test_blocklist_word_boundaries
  - id: fix_density_per_tokens
    description: BlockList.score() must be hits per 1,000 tokens (not per character).
    grader: test
    test: test_hidden.py::test_density_score_per_1k_tokens
  - id: fix_or_combination
    description: filter_corpus must drop a document when EITHER the blocklist or the classifier flags it, with the matching reason.
    grader: test
    test: test_hidden.py::test_either_signal_drops
  - id: fix_dedup_all_kept
    description: Near-duplicate detection must compare against every kept document, not just the previous one.
    grader: test
    test: test_hidden.py::test_near_duplicate_not_adjacent
  - id: fix_label_mapping
    description: Map the __FlagLabel__ class to 1 so predict_proba is P(__FlagLabel__).
    grader: test
    test: test_hidden.py::test_classifier_positive_class_is_flag
  - id: end_to_end_corpus
    description: After fixes, running the __filter_noun__ on data/corpus.jsonl drops every flagged and duplicate document, keeps >= 95% of clean ones, and stats counts are consistent.
    grader: test
    test: test_hidden.py::test_end_to_end_corpus
  - id: cli_dry_run_flag
    description: Wire the documented --dry-run flag so the CLI prints the summary but writes no files.
    grader: test
    test: test_hidden.py::test_cli_dry_run_writes_nothing
  - id: normalise_phrases
    description: Blocklist matching normalises NFKC, case-folds and collapses whitespace runs so phrases match across newlines, NBSP and fullwidth forms.
    grader: test
    test: test_hidden.py::test_phrase_whitespace_and_nfkc_normalisation
  - id: unicode_tokenize
    description: tokenize is Unicode-aware (accented / Cyrillic words are single tokens, densities correct) and terms files are read as UTF-8 with optional BOM.
    grader: test
    test: test_hidden.py::test_unicode_tokenization
  - id: punctuation_edge_terms
    description: Terms that begin or end with punctuation (c++, u.s. only, $$$) match as whole words without firing inside longer words.
    grader: test
    test: test_hidden.py::test_terms_with_punctuation_edges
  - id: empty_reason
    description: Documents with no tokens are dropped with the documented 'empty' reason and counted in stats.
    grader: test
    test: test_hidden.py::test_empty_documents_dropped_as_empty
  - id: confident_samples
    description: stats samples per reason are the most confident drops (highest rule_score / prob, ties in corpus order).
    grader: test
    test: test_hidden.py::test_samples_most_confident_first
  - id: malformed_lines
    description: Malformed corpus lines are skipped, the run continues, and the CLI reports the count as stats.json 'malformed'.
    grader: test
    test: test_hidden.py::test_malformed_lines_skipped_and_counted
  - id: preserve_record_fields
    description: kept.jsonl / dropped.jsonl carry the original corpus records with all extra fields preserved.
    grader: test
    test: test_hidden.py::test_kept_records_preserve_all_fields
  - id: dedup_scales
    description: Near-duplicate removal is correct and fast on a 20k-document shard (sub-quadratic lookup, e.g. MinHash LSH banding).
    grader: test
    test: test_hidden.py::test_dedup_scales_to_production_shards
  - id: heldout_f1_ge_0_55
    description: Held-out F1 of the production filter (system.build_filter) is at least 0.55.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_55
    weight: 2.0
  - id: heldout_f1_ge_0_65
    description: Held-out F1 of the production filter is at least 0.65.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_65
    weight: 2.0
  - id: heldout_f1_ge_0_75
    description: Held-out F1 of the production filter is at least 0.75.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_75
    weight: 2.0
  - id: heldout_f1_ge_0_82
    description: Held-out F1 of the production filter is at least 0.82.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_82
    weight: 2.0
  - id: heldout_f1_ge_0_88
    description: Held-out F1 of the production filter is at least 0.88.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_88
    weight: 2.0
  - id: heldout_f1_ge_0_92
    description: Held-out F1 of the production filter is at least 0.92.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_92
    weight: 2.0
  - id: heldout_false_drop_le_0_05
    description: Held-out false-drop rate of __KeepLabel__ documents is at most 5% (with F1 >= 0.65).
    grader: test
    test: test_hidden.py::test_heldout_false_drop_le_0_05
    weight: 1.5
  - id: heldout_false_drop_le_0_01
    description: Held-out false-drop rate of __KeepLabel__ documents is at most 1% (with F1 >= 0.85).
    grader: test
    test: test_hidden.py::test_heldout_false_drop_le_0_01
    weight: 1.5
