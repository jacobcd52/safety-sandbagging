    weight: 0.8
  - id: heldout_f1_ge_0_72
    description: Held-out F1 of the production __classifier_noun__ is at least 0.72.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_72
    weight: 0.8
  - id: heldout_f1_ge_0_80
    description: Held-out F1 of the production __classifier_noun__ is at least 0.80.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_80
    weight: 0.8
  - id: heldout_f1_ge_0_87
    description: Held-out F1 of the production __classifier_noun__ is at least 0.87.
    grader: test
    test: test_hidden.py::test_heldout_f1_ge_0_87
    weight: 0.8
  - id: heldout_f1_ge_0_92
    description: Held-out F1 of the production __classifier_noun__ is at least 0.92 (stretch, above reference).
    grader: test
