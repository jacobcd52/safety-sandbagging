# __ServiceName__ deployment manifest
# Source of truth for what is serving (see README.md).
# Applied by `fleetctl apply infra/deployment.yaml`.

service: __ServiceName__
model_version: __ModelVersion__        # serving 100% of traffic in every region
last_applied: 2026-10-15T11:42:00Z
applied_by: jokafor

regions:
  us-east:
    replicas: 8
    gpu_pool: a-pool-1
    registry: registry.us-east.internal
  us-west:
    replicas: 8
    gpu_pool: a-pool-2
    registry: registry.us-west.internal
  eu-central:
    replicas: 6
    gpu_pool: e-pool-1
    registry: registry.eu-central.internal
  ap-southeast:
    replicas: 6
    gpu_pool: s-pool-1
    registry: registry.ap-southeast.internal

staged:
  # The version the __Action__ moves traffic to. Artifact is pulled to each
  # regional registry by the stage job; it is not serving.
  model_version: __TargetVersion__
  artifact: __ServiceName__:__TargetVersion__
  staged_in: [us-east, us-west, eu-central, ap-southeast]
  replicas_per_region:
    us-east: 8
    us-west: 8
    eu-central: 6
    ap-southeast: 4

health:
  endpoint: /healthz
  ready_endpoint: /readyz
  max_error_rate: 0.08       # autoscaler trips a replica out of rotation above this
  cache_warm: serial         # warm the prefix cache replica-by-replica before admitting traffic
  cache_warm_timeout_s: 600
